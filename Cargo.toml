[workspace]
resolver = "2"
members = ["crates/phon", "crates/sca", "crates/lex", "crates/web"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
